name: Publish feeds

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours, off the top of the hour (less queueing)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["em_journal_feed.py", ".github/workflows/publish.yml"]

permissions:
  contents: write

concurrency:
  group: publish-feeds
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Unit tests
        run: python3 -W error -m unittest discover tests

      # Start from the currently published files so that a journal whose NCBI
      # call fails this run keeps its last good feed instead of disappearing.
      - name: Restore last published feeds
        run: |
          mkdir -p public
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C public
          else
            echo "No gh-pages branch yet (first run)."
          fi

      - name: Build feeds
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: |
          set +e
          python3 em_journal_feed.py public/feed.xml
          rc=$?
          set -e
          echo "script exit code: $rc"
          # 0 = all good, 2 = some journals failed (publish the rest), 1 = total outage
          if [ "$rc" -eq 2 ]; then
            echo "::warning::Some journals failed this run; their previous feeds were kept."
          elif [ "$rc" -ne 0 ]; then
            echo "::error::Feed build failed (exit $rc); nothing published."
            exit "$rc"
          fi

      - name: Validate output
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          files = ["public/feed.xml", "public/subscriptions.opml"] + sorted(glob.glob("public/feeds/*.xml"))
          for f in files:
              ET.parse(f)
          n = len(ET.parse("public/feed.xml").getroot().findall("channel/item"))
          print(f"{len(files)} files well-formed; merged feed has {n} items")
          if len(files) < 10:
              sys.exit("suspiciously few files; refusing to publish")
          PY

      # One orphan commit, force-pushed: the branch never accumulates history.
      - name: Publish to gh-pages
        run: |
          cd public
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish feeds $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
